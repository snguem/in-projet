<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1F4FD8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="In Project"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body><title>In Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Dashboard = result, quick actions, investment, chart, ranking, categories, recent. Onboarding on first run.
   Each project opens on its own screen. Forms are full-screen views; bottom tab bar. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #E8ECF1;
  --line: #D8DEE6;
  --fg: #121C26;
  --muted: #5A6776;
  --accent: #1F4FD8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EAFC;
  --in: #16794A;
  --in-soft: #DFF1E7;
  --out: #B23B2B;
  --out-soft: #FBE6E2;
  --warn: #8A5A00;
  --warn-soft: #FFF0D3;
  --font: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1218; --surface: #151C24; --surface-2: #1E2731; --line: #2A3541;
    --fg: #EAF0F6; --muted: #9AA8B7; --accent: #86A2FF; --accent-ink: #0D1218; --accent-soft: #1B2A55;
    --in: #58C48C; --in-soft: #123324; --out: #F08A78; --out-soft: #3A1A15;
    --warn: #F2C163; --warn-soft: #3A2C0B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1218; --surface: #151C24; --surface-2: #1E2731; --line: #2A3541;
  --fg: #EAF0F6; --muted: #9AA8B7; --accent: #86A2FF; --accent-ink: #0D1218; --accent-soft: #1B2A55;
  --in: #58C48C; --in-soft: #123324; --out: #F08A78; --out-soft: #3A1A15;
  --warn: #F2C163; --warn-soft: #3A2C0B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-inline: 16px; padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 520px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px; }
.top h1 { flex: 1; min-width: 0; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex: none; }
.iconbtn { width: 42px; height: 42px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.seg { display: inline-flex; align-self: flex-start; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.16); }

.summary { display: flex; flex-direction: column; gap: 12px; }
.net-label { font-size: 13px; color: var(--muted); font-weight: 500; }
.net { font-family: var(--mono); font-size: 34px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.net small { font-size: 14px; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.pos { color: var(--in); }
.neg { color: var(--out); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.stat span { display: block; font-size: 12px; color: var(--muted); }
.stat b { font-family: var(--mono); font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .tx { fill: var(--muted); font: 11px var(--font); }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .bi { fill: var(--in); }
.chart .bo { fill: var(--out); }
.legend { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .li { background: var(--in); }
.legend .lo { background: var(--out); }

.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sec h2 { margin: 0; font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; padding: 6px 0; }

.plist { display: flex; flex-direction: column; gap: 10px; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.prow-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.prow strong { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.prow .amt { font-family: var(--mono); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.prow .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs button { flex: 1; max-width: 200px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border-radius: 10px; color: var(--muted); font-size: 11px; font-weight: 600; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.chip.ex { background: var(--warn-soft); color: var(--warn); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 16px; font-weight: 600; font-size: 14px; min-height: 46px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.in { background: var(--in-soft); color: var(--in); border-color: transparent; }
.btn.out { background: var(--out-soft); color: var(--out); border-color: transparent; }
.btn.danger { color: var(--out); border-color: var(--out); background: transparent; }
.btn.block { width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.offers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.offer { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
.offer .nm { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.offer .pr { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); font-size: 14px; }

.mv-month { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: capitalize; margin: 6px 0 2px; }
.mvs { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.mv { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 11px 12px; border-top: 1px solid var(--line); }
.mv:first-child { border-top: 0; }
.mv-label { display: block; font-weight: 500; overflow-wrap: anywhere; }
.mv-meta { display: block; font-size: 12px; color: var(--muted); }
.mv-amt { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 500; }
.mv-del { border: 0; background: none; color: var(--muted); padding: 0; min-width: 40px; min-height: 40px; border-radius: 10px; display: grid; place-items: center; }
.mv-del svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mv-del.armed { color: var(--out); font-weight: 600; font-size: 12px; border: 1px solid var(--out); padding: 0 10px; }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.banner button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 4px 0; }
.empty { text-align: center; padding: 28px 16px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }

.f { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; min-width: 0; }
.f label { font-size: 13px; font-weight: 600; }
.f input[type="text"], .f input[type="number"], .f input[type="date"], .f select, textarea {
  font: inherit; font-size: 16px; width: 100%; min-width: 0; padding: 11px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
textarea { font: 12px/1.4 var(--mono); min-height: 110px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.total { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; margin-bottom: 12px; font-weight: 600; }
.total b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }
.err { color: var(--out); font-size: 13px; margin: 0 0 10px; }
.err:empty { display: none; }
.radios { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.radio { position: relative; }
.radio input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.radio span { display: block; text-align: center; padding: 11px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 600; font-size: 14px; }
.radio input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.radio input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; text-align: center; }

.eyebrow { margin: 0; font-size: 13px; color: var(--muted); }
.eyebrow::first-letter { text-transform: uppercase; }
.top.stack { align-items: flex-start; }
.top .greet { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.delta { font-size: 13px; font-weight: 600; }
.delta.pos, .delta.neg { }
.delta.flat { color: var(--muted); }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row3 .btn { padding-inline: 8px; }
.btn.tm { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.stat b.txt { font-family: var(--font); font-weight: 600; }
.meter { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.meter.over i { background: var(--out); }
.budget { display: flex; flex-direction: column; gap: 6px; }
.budget .bt { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.budget .bt b { color: var(--fg); font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.bar-row .bl { display: flex; justify-content: space-between; gap: 10px; }
.bar-row .bl b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-row .meter i { background: var(--out); }
.recs { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.rec { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 12px; }
.recs li:first-child .rec { border-top: 0; }
.rec .mv-amt { font-size: 14px; }
.kindmark { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-right: 6px; }
.kindmark.in { background: var(--in-soft); color: var(--in); }
.kindmark.out { background: var(--out-soft); color: var(--out); }
.kindmark.tm { background: var(--accent-soft); color: var(--accent); }
[aria-invalid="true"] { border-color: var(--out) !important; }
.ob { display: flex; flex-direction: column; gap: 18px; min-height: calc(100vh - 140px); justify-content: center; padding-top: 24px; }
.ob .logo { width: 56px; height: 56px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--mono); font-weight: 500; font-size: 20px; }
.ob h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance; }
.ob p { margin: 0; color: var(--muted); font-size: 16px; }
.ob ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.ob li { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.ob li b { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 13px; }
.ob li span { min-width: 0; }
.ob li em { display: block; font-style: normal; color: var(--muted); font-size: 13px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 22px; border-radius: 999px; }
.ob-actions { display: flex; flex-direction: column; gap: 10px; }
.linkbtn { border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 10px; }
details.faq { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
details.faq + details.faq { margin-top: 8px; }
details.faq summary { cursor: pointer; padding: 13px 0; font-weight: 600; font-size: 14px; }
details.faq p { margin: 0 0 13px; color: var(--muted); font-size: 14px; }
.mv-sum { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
.mv-sum .mv-month { margin: 0; }
.mv-sum b { font-family: var(--mono); font-weight: 500; }
.pickrow { }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 6px; min-height: 36px; }
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Navigation"></nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';
  var KEY = 'inproject_v1';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var dkey = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var today = function () { return dkey(new Date()); };
  var ym = function (k) { return k.slice(0, 7); };
  var uid = function () { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); };
  var toNum = function (v) { var x = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(x) ? x : NaN; };
  var nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
  var num = function (n) { return nf.format(Math.round(n)).replace(/[  ]/g, ' '); };
  var signed = function (n) { return (n < 0 ? '− ' : n > 0 ? '+ ' : '') + num(Math.abs(n)); };
  var compact = function (n) {
    if (n >= 1e6) return (Math.round(n / 1e5) / 10).toString().replace('.', ',') + ' M';
    if (n >= 1000) return Math.round(n / 1000) + ' k';
    return String(Math.round(n));
  };
  var cls = function (n) { return n > 0 ? 'pos' : n < 0 ? 'neg' : ''; };
  var fmtDay = function (k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); };
  var fmtMonth = function (k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); };
  var fmtH = function (min) {
    min = Math.round(min);
    var h = Math.floor(min / 60), m = min % 60;
    if (!h) return m + ' min';

  function offersSection(p) {

  function movementsSection(p) {

  /* ---------- Formulaires (écrans dédiés) ---------- */
  function openForm(title, body, submit, label, extra) {
    form = { title: title, body: body, submit: submit, label: label, extra: extra, back: { name: view.name, id: view.id } };
    view = { name: 'form', id: null };
    render(); window.scrollTo(0, 0);
    setTimeout(function () { var f = $('#sheet-form input[type="text"]'); if (f && !f.value) f.focus(); }, 80);
  }
  function closeForm() { if (form) { if (view.name === 'form') view = form.back; form = null; } }
  function submitForm() {
    if (!form || !form.submit) return;
    var res = form.submit(new FormData($('#sheet-form')));
    if (res) {
      $('#err').textContent = typeof res === 'string' ? res : res.msg;
      if (res.id) { var el = $('#' + res.id); if (el) { el.setAttribute('aria-invalid', 'true'); el.focus(); } }
      return;
    }
    closeForm(); save(); render(); window.scrollTo(0, 0);
  }
  function refreshTotal() {
    var el = $('#f-total'); if (!el) return;

    var m = $('#f-months') ? toNum($('#f-months').value) : 1;

  }
  function arm(el, text, fn) {

  }

  function formPick(kind) {

      field('f-offer', 'Offre', '<select id="f-offer" name="offer">' + opts + '</select>') +
      '<div class="two">' + field('f-qty', p.type === 'abonnement' ? 'Nombre d’abonnés' : 'Nombre de ventes', numInput('f-qty', 'qty', 1)) +
      field('f-unit', p.type === 'abonnement' ? 'Prix par mois' : 'Prix unitaire', numInput('f-unit', 'unit', first && first.price ? first.price : '')) + '</div>' +
      (p.type === 'abonnement' ? field('f-months', 'Durée en mois', numInput('f-months', 'months', 1, 1)) : '') +
      '<div class="total"><span>Total</span><b id="f-total">0</b></div>' +
      field('f-date', 'Date', '<input id="f-date" name="date" type="date" value="' + today() + '">') +
      field('f-note', 'Note (facultatif)', '<input id="f-note" name="note" type="text" maxlength="80" placeholder="Client, détail…">');
    openForm('Nouvelle vente', body, function (fd) {
      var q = toNum(fd.get('qty')), u = toNum(fd.get('unit')), m = p.type === 'abonnement' ? toNum(fd.get('months')) : 1;
      if (!(q > 0)) return fail('f-qty', 'Indique une quantité supérieure à 0.');
      if (!(u > 0)) return fail('f-unit', 'Indique un prix supérieur à 0.');
      if (!(m >= 1)) return fail('f-months', 'La durée doit être d’au moins 1 mois.');
      var date = fd.get('date'); if (!date) return fail('f-date', 'Choisis une date.');
      var offer = p.offers.find(function (o) { return o.id === fd.get('offer'); });
      var note = (fd.get('note') || '').trim();
      p.entries.push({ id: uid(), kind: 'in', date: date, label: offer ? offer.name : (note || 'Vente'), note: offer ? note : '', qty: q, unit: u, months: m, amount: q * u * m, offerId: offer ? offer.id : null });
      ptab = 'mv'; toast('Vente de ' + money(q * u * m) + ' ajoutée'); return null;
    }, 'Ajouter la vente');
  }
  function formExpense(p) {
    var body = '<p class="note" style="margin-bottom:12px">' + esc(p.name) + '</p>' +
      field('f-label', 'Libellé', '<input id="f-label" name="label" type="text" maxlength="60" autocomplete="off" placeholder="Ex. Hébergement, publicité…">') +
      '<div class="two">' + field('f-amount', 'Montant', numInput('f-amount', 'amount', '')) +
      field('f-date', 'Date', '<input id="f-date" name="date" type="date" value="' + today() + '">') + '</div>' +
      field('f-cat', 'Catégorie', '<select id="f-cat" name="cat">' + CATS.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') + '</select>');
    openForm('Nouvelle dépense', body, function (fd) {
      var label = (fd.get('label') || '').trim(), a = toNum(fd.get('amount'));
      if (!label) return fail('f-label', 'Donne un libellé à la dépense.');
      if (!(a > 0)) return fail('f-amount', 'Indique un montant supérieur à 0.');
      var date = fd.get('date'); if (!date) return fail('f-date', 'Choisis une date.');
      p.entries.push({ id: uid(), kind: 'out', date: date, label: label, category: fd.get('cat'), amount: a });
      ptab = 'mv'; toast('Dépense de ' + money(a) + ' ajoutée'); return null;
    }, 'Ajouter la dépense');
  }
  function formTime(p) {
    var body = '<p class="note" style="margin-bottom:12px">' + esc(p.name) + '</p>' +
      '<div class="two">' + field('f-h', 'Heures', numInput('f-h', 'h', 1, 0, 1)) + field('f-mi', 'Minutes', numInput('f-mi', 'mi', 0, 0, 1)) + '</div>' +
      field('f-date', 'Date', '<input id="f-date" name="date" type="date" value="' + today() + '">') +
      field('f-note', 'Qu’as-tu fait ? (facultatif)', '<input id="f-note" name="note" type="text" maxlength="80" placeholder="Ex. Prospection, création du site…">');
    openForm('Temps passé', body, function (fd) {
      var h = toNum(fd.get('h')), m = toNum(fd.get('mi'));
      h = isFinite(h) ? h : 0; m = isFinite(m) ? m : 0;
      var total = Math.round(h * 60 + m);
      if (!(total > 0)) return fail('f-h', 'Indique une durée supérieure à 0.');
      if (total > 24 * 60) return fail('f-h', 'Une séance ne peut pas dépasser 24 heures.');
      var date = fd.get('date'); if (!date) return fail('f-date', 'Choisis une date.');
      p.time.push({ id: uid(), date: date, minutes: total, note: (fd.get('note') || '').trim() });
      ptab = 'time'; toast(fmtH(total) + ' ajoutées'); return null;
    }, 'Ajouter le temps');
  }
  function formBudget(p) {
    var body = '<p class="note" style="margin-bottom:12px">' + esc(p.name) + '</p>' +
      field('f-budget', 'Budget prévu (' + esc(S.settings.currency) + ')', numInput('f-budget', 'budget', p.budget || ''), 'Somme maximale que tu veux investir dans ce projet. Laisse vide pour ne pas en fixer.');
    openForm('Budget du projet', body, function (fd) {
      var b = toNum(fd.get('budget'));
      p.budget = b > 0 ? b : 0; toast('Budget enregistré'); return null;
    }, 'Enregistrer');
  }
  function formOffer(p, o) {
    var body = field('f-oname', 'Nom', '<input id="f-oname" name="name" type="text" maxlength="60" autocomplete="off" value="' + esc(o ? o.name : '') + '" placeholder="' + (p.type === 'abonnement' ? 'Ex. Formule mensuelle' : 'Ex. Site vitrine') + '">') +
      field('f-oprice', p.type === 'abonnement' ? 'Prix par mois (facultatif)' : 'Prix (facultatif)', numInput('f-oprice', 'price', o && o.price ? o.price : ''),
        o ? 'Les ventes déjà saisies gardent leur prix.' : 'Tu pourras toujours le modifier au moment de la vente.');
    openForm(o ? 'Modifier l’offre' : 'Nouvelle offre', body, function (fd) {
      var name = (fd.get('name') || '').trim(), price = toNum(fd.get('price'));
      if (!name) return fail('f-oname', 'Donne un nom à l’offre.');
      if (o) { o.name = name; o.price = price > 0 ? price : 0; }
      else p.offers.push({ id: uid(), name: name, price: price > 0 ? price : 0 });
      ptab = 'offers'; toast('Offre enregistrée'); return null;
    }, 'Enregistrer', o ? '<button type="button" class="btn danger block" style="margin-top:10px" data-act="del-offer" data-id="' + esc(o.id) + '">Supprimer l’offre</button>' : '');
  }
  function formProject(p) {
    var type = p ? p.type : 'service';
    var body = field('f-name', 'Nom du projet', '<input id="f-name" name="name" type="text" maxlength="60" autocomplete="off" value="' + esc(p ? p.name : '') + '" placeholder="Ex. Gestion salle de sport">') +
      '<div class="f"><label>Type de projet</label><div class="radios">' +
      '<label class="radio"><input type="radio" name="type" value="service"' + (type === 'service' ? ' checked' : '') + '><span>Service</span></label>' +
      '<label class="radio"><input type="radio" name="type" value="abonnement"' + (type === 'abonnement' ? ' checked' : '') + '><span>Abonnement</span></label></div>' +
      '<span class="hint">Service : tu factures des prestations, chacune a un prix. Abonnement : les clients paient chaque mois, avec un prix par mois et par abonné.</span></div>' +
      (p ? '' : '<p class="note" style="margin-bottom:12px">Tu ajouteras les offres, le budget et les prix dans l’espace du projet.</p>');
    openForm(p ? 'Modifier le projet' : 'Nouveau projet', body, function (fd) {
      var name = (fd.get('name') || '').trim();
      if (!name) return fail('f-name', 'Donne un nom au projet.');
      var t = fd.get('type') === 'abonnement' ? 'abonnement' : 'service';
      if (p) { p.name = name; p.type = t; toast('Projet mis à jour'); return null; }
      var np = { id: uid(), name: name, type: t, budget: 0, offers: [], entries: [], time: [] };
      S.projects.push(np); view = { name: 'project', id: np.id }; ptab = 'offers';
      toast('Projet créé · ajoute maintenant tes offres'); return null;
    }, p ? 'Enregistrer' : 'Créer le projet', p ? '<button type="button" class="btn danger block" style="margin-top:10px" data-act="del-project">Supprimer ce projet</button>' : '');
  }

  /* ---------- Actions ---------- */
  function copyBackup() {
    var json = JSON.stringify(S);
    var fallback = function () { var ta = $('#backup'); ta.hidden = false; ta.value = json; ta.focus(); ta.select(); toast('Sélectionne le texte puis copie-le'); };
    try { navigator.clipboard.writeText(json).then(function () { toast('Sauvegarde copiée'); }, fallback); } catch (e) { fallback(); }
  }
  function restore() {
    var err = $('#restore-err'), raw = ($('#restore').value || '').trim();
    var d = null;
    try { d = normalize(JSON.parse(raw)); } catch (e) { d = null; }
    if (!d) { err.textContent = 'Ce texte n’est pas une sauvegarde valide.'; return; }
    S = d; save(); go('dash'); toast('Sauvegarde restaurée');
  }
  function removeItem(list, id, msg) {
    var i = list.findIndex(function (x) { return x.id === id; });
    if (i < 0) return;
    var item = list.splice(i, 1)[0];
    save(); render();
    toast(msg, function () { list.splice(i, 0, item); });
  }
  function act(a, el) {
    var p = view.name === 'project' ? proj(view.id) : (form && form.back.name === 'project' ? proj(form.back.id) : null);
    switch (a) {
      case 'tab': go(el.dataset.v); break;
      case 'new-project': formProject(null); break;
      case 'back': go('projects'); break;
      case 'open': ptab = 'mv'; go('project', el.dataset.id); break;
      case 'period': period = el.dataset.v === 'all' ? 'all' : 'month'; render(); break;
      case 'ptab': ptab = el.dataset.v === 'offers' ? 'offers' : el.dataset.v === 'time' ? 'time' : 'mv'; render(); break;
      case 'sale': if (p) formSale(p); break;
      case 'expense': if (p) formExpense(p); break;
      case 'time': if (p) formTime(p); break;
      case 'budget': if (p) formBudget(p); break;
      case 'quick':
        if (!S.projects.length) { formProject(null); toast('Crée d’abord un projet'); }
        else if (S.projects.length === 1) startKind(el.dataset.v, S.projects[0]);
        else formPick(el.dataset.v);
        break;
      case 'pick': var pp = proj(el.dataset.id); if (pp) { var back = form.back; form = null; view = back; startKind(el.dataset.v, pp); } break;
      case 'offer-new': if (p) formOffer(p, null); break;
      case 'offer-edit': if (p) formOffer(p, p.offers.find(function (o) { return o.id === el.dataset.id; })); break;
      case 'edit-project': if (p) formProject(p); break;
      case 'close-form': closeForm(); render(); window.scrollTo(0, 0); break;
      case 'submit-form': submitForm(); break;
      case 'del':
        if (p) removeItem(el.dataset.k === 'time' ? p.time : p.entries, el.dataset.id, el.dataset.k === 'time' ? 'Séance supprimée' : 'Mouvement supprimé');
        break;
      case 'undo':
        if (undoFn) { undoFn(); undoFn = null; save(); render(); $('#toast').hidden = true; }
        break;
      case 'del-offer': if (p) arm(el, 'Confirmer la suppression', function () {
        p.offers = p.offers.filter(function (o) { return o.id !== el.dataset.id; }); ptab = 'offers'; closeForm(); save(); render(); window.scrollTo(0, 0); toast('Offre supprimée'); }); break;
      case 'del-project': if (p) arm(el, 'Confirmer la suppression', function () {
        S.projects = S.projects.filter(function (x) { return x.id !== p.id; }); closeForm(); save(); go('projects'); toast('Projet supprimé'); }); break;
      case 'rm-examples':
        S.projects = S.projects.filter(function (x) { return !x.example; }); save(); render(); toast('Exemples supprimés'); break;
      case 'wipe': arm(el, 'Confirmer : tout effacer', function () {
        S.projects = []; save(); go('dash'); toast('Données effacées'); }); break;
      case 'copy-backup': copyBackup(); break;
      case 'restore': restore(); break;
      case 'show-intro': obStep = 0; go('onboarding'); break;
      case 'ob-next': obStep = Math.min(obStep + 1, 2); render(); window.scrollTo(0, 0); break;
      case 'ob-skip': finishIntro(); go('dash'); break;
      case 'ob-demo': finishIntro(); S.projects = seed(); save(); go('dash'); toast('Exemples ajoutés · supprime-les quand tu veux'); break;
      case 'ob-create': finishIntro(); go('projects'); formProject(null); break;
    }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (el) act(el.dataset.act, el);
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key === 'Enter' && t && t.tagName === 'INPUT' && t.type !== 'radio' && t.closest && t.closest('#sheet-form')) { e.preventDefault(); submitForm(); }
    if (e.key === 'Escape' && form) { closeForm(); render(); }
  });
  document.addEventListener('submit', function (e) { e.preventDefault(); });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.dataset && e.target.dataset.input === 'currency') {
      S.settings.currency = (e.target.value || '').trim() || 'FCFA'; save(); toast('Devise enregistrée');
    }
  });
  document.addEventListener('input', function (e) {
    if (!e.target.closest || !e.target.closest('#sheet-form')) return;
    e.target.removeAttribute('aria-invalid');
    if (e.target.id === 'f-offer') {
      var o = e.target.selectedOptions[0], u = $('#f-unit');
      if (u && o) u.value = o.dataset.price || '';
    }
    refreshTotal();
  });

  render();
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body></html>
